[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core" ]

[tool.poetry]
name = "owasp-nest-documentation"
version = "0.1.0"
description = "OWASP Nest Documentation"
license = "MIT"
authors = [ "Arkadii Yakovets <arkadii.yakovets@owasp.org>" ]
packages = [ { include = "serve.py" } ]
dependencies.python = "^3.13"
dependencies.click = "8.3.3"
# mkdocstrings still imports the MkDocs 1.x compatibility API.
dependencies.mkdocs = "^1.6.1"
dependencies.mkdocstrings = { version = "^1.0.0", extras = [ "python" ] }
dependencies.pymdown-extensions = "^11.0.0"
dependencies.urllib3 = "2.8.0"
dependencies.zensical = "0.0.72"
group.test.dependencies.pytest = "9.0.3"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "." ]
