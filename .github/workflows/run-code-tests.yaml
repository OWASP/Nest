name: Code tests

on:
  workflow_call:
    secrets:
      LOCALSTACK_AUTH_TOKEN:
        required: false

permissions: {}

env:
  FORCE_COLOR: 1

jobs:
  run-backend-tests:
    name: Backend tests
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/run-backend-tests.yaml

  run-backend-coverage-upload:
    name: Backend coverage upload
    if: github.event.repository.fork == false
    needs:
      - run-backend-tests
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/run-coverage-upload.yaml
    with:
      artifact_name: coverage-xml
      artifact_path: backend
      coverage_flags: backend
      coverage_path: backend/coverage.xml

  run-frontend-tests:
    name: Frontend tests
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/run-frontend-tests.yaml

  run-frontend-coverage-upload:
    name: Frontend coverage upload
    if: github.event.repository.fork == false
    needs:
      - run-frontend-tests
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/run-coverage-upload.yaml
    with:
      artifact_name: coverage-lcov
      artifact_path: frontend/coverage
      coverage_flags: frontend
      coverage_path: frontend/coverage/lcov.info

  run-e2e-tests:
    name: E2E tests
    permissions:
      contents: read
    uses: ./.github/workflows/run-e2e-tests.yaml

  run-fuzz-rest-tests:
    name: REST fuzz tests
    permissions:
      contents: read
    uses: ./.github/workflows/run-fuzz-tests.yaml
    with:
      rest-url: http://localhost:9500/api/v0
      test-file: rest_test.py

  run-infrastructure-tests:
    name: Infrastructure tests
    permissions:
      contents: read
    secrets:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    uses: ./.github/workflows/run-infrastructure-tests.yaml

  run-tools-tests:
    name: Tools tests
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run tools tests
        run: make test-tools
    timeout-minutes: 10
