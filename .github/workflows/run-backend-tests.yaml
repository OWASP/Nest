name: Backend tests

on:
  workflow_call:

env:
  FORCE_COLOR: 1

permissions: {}

jobs:
  run-unit-tests:
    name: Backend unit tests
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    services:
      db:
        image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_DB: nest_db_unit
          POSTGRES_PASSWORD: unit-test
          POSTGRES_USER: nest_user_unit
        options: >-
          --health-cmd "pg_isready -U nest_user_unit -d nest_db_unit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install backend dependencies
        uses: ./.github/actions/install-backend-dependencies

      - name: Run backend tests
        run: |
          set -a
          source .env.unit-tests
          export DJANGO_DB_HOST=localhost DJANGO_DB_NAME=nest_db_unit
          export DJANGO_DB_USER=nest_user_unit DJANGO_DB_PORT=5432
          set +a
          poetry run pytest tests/unit
        working-directory: backend

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          if-no-files-found: error
          name: coverage-xml
          path: backend/coverage.xml
    timeout-minutes: 5
