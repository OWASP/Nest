display_information:
  name: NestBot
  description: Your gateway to OWASP. Discover, engage, and help shape the future!
  background_color: '#1d293d'
  long_description: "OWASP NestBot is the OWASP community assistant integrated directly into Slack. It helps contributors, chapter leaders, project maintainers,\
    \ and newcomers quickly find information, navigate OWASP resources, and stay productive.\r\n\r\nNestBot can:\r\n  - Answer questions about OWASP projects,\
    \ chapters, events, and guidelines\r\n  - Provide helpful summaries and context for issues, repositories, and documents\r\n  - Assist with contributor\
    \ onboarding and point to the right resources\r\n  - Surface relevant information from OWASP Nest, including issues, analytics, and project metadata\r\
    \n\r\nBuilt on top of OWASP Nest data, NestBot is designed to improve collaboration, reduce friction, and make it easier for anyone to contribute to\
    \ OWASP."
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: NestBot
    always_online: true
  shortcuts:
    - name: Report content
      type: message
      callback_id: report_content
      description: Report a message to workspace moderators
  slash_commands:
    - command: /ai
      url: https://nest.owasp.org/integrations/slack/commands/
      description: AI-powered OWASP Nest assistant
      usage_hint: <your question>
      should_escape: false
    - command: /board
      url: https://nest.owasp.org/integrations/slack/commands/
      description: OWASP Global Board information
      should_escape: false
    - command: /chapters
      url: https://nest.owasp.org/integrations/slack/commands/
      description: chapters
      usage_hint: --help
      should_escape: false
    - command: /committees
      url: https://nest.owasp.org/integrations/slack/commands/
      description: committees
      usage_hint: <name>
      should_escape: false
    - command: /community
      url: https://nest.owasp.org/integrations/slack/commands/
      description: Explore OWASP community
      should_escape: false
    - command: /contact
      url: https://nest.owasp.org/integrations/slack/commands/
      description: Contact OWASP
      should_escape: false
    - command: /contribute
      url: https://nest.owasp.org/integrations/slack/commands/
      description: contributor's guide
      usage_hint: --help
      should_escape: false
    - command: /donate
      url: https://nest.owasp.org/integrations/slack/commands/
      description: Support OWASP with a donation
      should_escape: false
    - command: /events
      url: https://nest.owasp.org/integrations/slack/commands/
      description: Browse OWASP events
      should_escape: false
    - command: /gsoc
      url: https://nest.owasp.org/integrations/slack/commands/
      description: get started with GSoC
      usage_hint: --start
      should_escape: false
    - command: /jobs
      url: https://nest.owasp.org/integrations/slack/commands/
      description: Check out available job opportunities
      should_escape: false
    - command: /leaders
      url: https://nest.owasp.org/integrations/slack/commands/
      description: chapter and project leaders
      usage_hint: <name/chapter/project>
      should_escape: false
    - command: /news
      url: https://nest.owasp.org/integrations/slack/commands/
      description: OWASP news
      should_escape: false
    - command: /owasp
      url: https://nest.owasp.org/integrations/slack/commands/
      description: your gateway to OWASP
      usage_hint: --help
      should_escape: false
    - command: /policies
      url: https://nest.owasp.org/integrations/slack/commands/
      description: Policies & Procedures
      should_escape: false
    - command: /projects
      url: https://nest.owasp.org/integrations/slack/commands/
      description: project directory
      usage_hint: <search query>
      should_escape: false
    - command: /report
      url: https://nest.owasp.org/integrations/slack/commands/
      description: Report a Slack message to workspace moderators
      usage_hint: <message link>
      should_escape: false
    - command: /sponsor
      url: https://nest.owasp.org/integrations/slack/commands/
      description: Coming soon
      should_escape: false
    - command: /sponsors
      url: https://nest.owasp.org/integrations/slack/commands/
      description: Get a list of OWASP sponsors
      should_escape: false
    - command: /staff
      url: https://nest.owasp.org/integrations/slack/commands/
      description: OWASP corporate structure
      should_escape: false
    - command: /users
      url: https://nest.owasp.org/integrations/slack/commands/
      description: OWASP users list
      usage_hint: <user>
      should_escape: false
oauth_config:
  scopes:
    user:
      - channels:read
      - groups:read
      - mpim:read
      - users:read
    bot:
      - app_mentions:read
      - channels:history
      - channels:manage
      - channels:read
      - chat:write
      - commands
      - groups:read
      - groups:write
      - im:history
      - im:read
      - im:write
      - mpim:read
      - mpim:write
      - reactions:read
      - reactions:write
      - users:read
  pkce_enabled: false
settings:
  event_subscriptions:
    request_url: https://nest.owasp.org/integrations/slack/events/
    user_events:
      - member_joined_channel
      - team_join
    bot_events:
      - app_home_opened
      - app_mention
      - member_joined_channel
      - message.channels
      - reaction_added
      - team_join
  interactivity:
    is_enabled: true
    request_url: https://nest.owasp.org/integrations/slack/interactivity/
  is_mcp_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
