cache-dir = ".cache/pypoetry"

[solver]
# 21 days.
min-release-age = 21
min-release-age-exclude = [
    "aiohttp",             # 3.14.3
    "cryptography",        # 50.0.0
    "django",              # 6.0.8
    "idna",                # 3.15
    "langchain-core",      # 1.3.3
    "langsmith",           # 0.8.18
    "multidict",           # 6.9.1
    "pillow",              # 12.3.0
    "pyjwt",               # 2.15.1
    "starlette",           # 1.0.1
    "strawberry-graphql",  # 0.316.0
    "urllib3",             # 2.8.0
    "weasyprint",          # 70.0
    "werkzeug",            # 3.1.9
]

[virtualenvs]
create = true
in-project = true
use-poetry-python = true
