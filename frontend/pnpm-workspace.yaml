overrides:
  '@graphql-tools/executor-legacy-ws': 1.1.36
  # CVE-2026-104852 is fixed in 12.0.1. CVE-2026-114604 is fixed in 12.0.2;
  # 12.0.3 hardens the same path-key check.
  '@graphql-tools/utils': 12.0.3
  '@opentelemetry/core': 2.8.0
  # Keep Puppeteer's browser tools on v3, which removes extract-zip.
  '@puppeteer/browsers': 3.2.6
  # browsers 3.x peer is proxy-agent >=8.0.1; @lhci/cli still declares ^6.4.0.
  basic-ftp: 6.2.2
  # GHSA-27r3-jxmh-p828: compressed-body crash through 1.20.8, fixed in 1.20.9.
  body-parser: 1.20.9
  brace-expansion@5: 5.0.12
  browserslist: 4.28.7
  compression: 1.8.2
  # GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr, GHSA-c6gr-qvv4-5v3f: fixed in 3.4.17.
  dompurify: 3.4.17
  # GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h: fixed in 3.1.9.
  fast-uri: 3.1.9
  glob: 11.1.0
  immutable: 5.1.8
  # GHSA-rxp7-6hxx-x8q5: fixed in 10.7.4.
  ip-address: 10.7.4
  js-yaml: 4.3.2
  nanoid@3: 3.3.18
  postcss: 8.5.23
  protobufjs: 7.6.4
  proxy-addr: 2.0.8
  proxy-agent: 8.0.2
  # Puppeteer 25 uses Chromium BiDi with Zod 4 for GHSA-mrhx-c7xc-m3w5.
  puppeteer-core: 25.16.0
  qs: 6.16.1
  rxjs: 7.8.2
  serialize-javascript: 7.0.5
  # GHSA-wq5f-xc86-pv6w: librsvg in the 0.35.4 prebuilds, fixed in 0.35.5.
  sharp: 0.35.5
  # GHSA-pqg4-j6r4-53mv: quote() injection after a comment token, fixed in 1.11.0.
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  test-exclude: 7.0.2
  tmp: 0.2.7
  # jsdom 30 wants undici ^8.9.0. GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472,
  # and GHSA-xjj6-f33q-929c are fixed in 8.12.2.
  undici: 8.12.3
  uuid: 11.1.1
  webpack@5: 5.104.1
  ws@8: 8.22.0
  zod: 4.6.7

publicHoistPattern:
  - '*import-in-the-middle*'

saveExact: true

strictDepBuilds: true
