repos:
  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb  # v2.15.1
    hooks:
      - id: hadolint
        args:
          - --failure-threshold=warning
        name: hadolint

  - repo: https://github.com/EbodShojaei/bake
    rev: a39df91c8e2c8ee584f81ff8d7d00f137a5fc160  # v1.4.6
    hooks:
      - id: mbake-format
        args:
          - --config
          - .bake.toml
      - id: mbake-validate
        args:
          - --config
          - .bake.toml
        # Component Makefiles use root-relative includes and call shared targets; mbake
        # validates each file in isolation from its own directory, so only the root
        # Makefile can be checked.
        exclude: ^(backend|cspell|docs|e2e|frontend|infrastructure|make|tools)/

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # v1.38.0
    hooks:
      - id: yamllint
        args:
          - --format
          - parsable
          - --strict
        exclude: pnpm-lock.yaml

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: bf9dd9c695ddaf238af36f179049202358ec22b7  # v1.108.1
    hooks:
      - id: terraform_providers_lock
        args:
          - --args=-platform=darwin_arm64
          - --args=-platform=linux_amd64
          - --args=-platform=linux_arm64
          - --hook-config=--mode=regenerate-lockfile-if-some-platform-missed
        files: .terraform.lock.hcl
        name: Lock Terraform providers
      - id: terraform_fmt
        files: ^infrastructure/.*\.(tf|tftest\.hcl)$
      - id: terraform_tflint
        files: ^infrastructure/.*\.tf$
        args:
          - --args=--config=__GIT_WORKING_DIR__/infrastructure/.tflint.hcl

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2  # v0.16.1
    hooks:
      - id: ruff-check
        args:
          - --config
          - ruff.toml
          - --fix
      - id: ruff-format
        args:
          - --config
          - ruff.toml

  - repo: https://github.com/djlint/djLint
    rev: 1537d9f347a8312ebaeff95762266a780dd31e02  # v1.44.0
    hooks:
      - id: djlint-reformat-django
        files: templates/.*.html
        entry: djlint --reformat
        types:
          - html

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # v0.49.1
    hooks:
      - id: markdownlint
        args:
          - --fix
        files: \.md$

  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 8d1b9cadaf854cb25bb0b0f5870e1cc66a083d6b  # 0.2.3
    hooks:
      - id: yamlfmt
        args:
          - --implicit_start
          - --mapping=2
          - --offset=2
          - --sequence=4
        exclude: (pnpm-lock.yaml|\.yamllint)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 41e691678310dfd3833f7ab4e180ddb014310356  # v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - strawberry-graphql==0.323.2
          - strawberry-graphql-django==0.86.8
          - types-lxml==2026.2.16
          - types-python-dateutil==2.9.0.20260716
          - types-PyYAML==6.0.12.20260724
          - types-requests==2.33.0.20260712
        entry: bash -c 'cd backend && mypy --config-file pyproject.toml src tests'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
        # tsconfig.json uses JSONC (comments).
        # Matches frontend/tsconfig.json and frontend/**/tsconfig.json
        exclude: ^frontend/(?:[^/]+/)*tsconfig\.json$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: pnpm-lock\.yaml$
      - id: detect-private-key
        # Armor markers appear in the renewer/export helpers and test fixtures.
        exclude: ^tools/(security/renew_security_txt\.py|tests/security/renew_security_txt_test\.py)$
      - id: end-of-file-fixer
        exclude: frontend/src/types/__generated__
        exclude_types:
          - svg
      - id: file-contents-sorter
        args:
          - --unique
        files: (.github/check-contribution-skip-usernames.txt|cspell/custom-dict.txt)
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: name-tests-test
        args:
          - --pytest
        exclude: backend/tests/(cluster-fuzz-lite|data)
        files: backend/tests
      - id: trailing-whitespace
        exclude: pnpm-lock.yaml

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: https://github.com/terraform-docs/terraform-docs
    rev: 9d4455198941806aa02ec14369de030cda2c2b59  # v0.24.0
    hooks:
      - id: terraform-docs-go
        args:
          - infrastructure/
        files: ^infrastructure/.*\.tf$|^infrastructure/\.terraform-docs\.ya?ml$

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: b82a24a520c5d496cb7b23b4e9b63537c280f51b  # v2.27.0
    hooks:
      - id: pyproject-fmt
        additional_dependencies:
          - toml-fmt-common<1.3.3

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # v1.29.0
    hooks:
      - id: zizmor
        args:
          - --min-severity=low
