services:
  localstack:
    build:
      context: ../..
      dockerfile: docker/localstack/Dockerfile
    environment:
      # https://docs.localstack.cloud/aws/services/ecr/#endpoint-strategy
      - ECR_ENDPOINT_STRATEGY=off
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 15s
      test: [CMD, curl, -f, http://localhost:4566/_localstack/info]
      timeout: 5s
    networks:
      - infrastructure-nest
    ports:
      - 443:443
      - 4510-4559:4510-4559
      - 4566:4566
    volumes:
      # Host Docker socket so LocalStack can start sibling containers (Lambda, ECS, etc.).
      - /var/run/docker.sock:/var/run/docker.sock

  runner:
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      LOCALSTACK_HOST: localhost
    image: nest-infrastructure
    network_mode: service:localstack
    pull_policy: never
    volumes:
      - infrastructure-terraform-plugin-cache:/home/owasp/.terraform.d/plugin-cache

networks:
  infrastructure-nest:

volumes:
  infrastructure-terraform-plugin-cache:
    name: infrastructure-terraform-plugin-cache
