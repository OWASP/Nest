services:
  backend:
    container_name: nest-backend
    command: >
      sh -c '
        python manage.py migrate &&
        python manage.py clear_cache &&
        python manage.py runserver 0.0.0.0:8000
      '
    image: nest-local-backend
    build:
      context: ../../backend
      dockerfile: ../docker/backend/Dockerfile.local
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file: ../../backend/.env
    networks:
      - nest-network
    ports:
      - 8000:8000
    volumes:
      - ../../backend:/home/owasp
      - backend-venv:/home/owasp/.venv

  cache:
    command: >
      sh -c '
        redis-server --requirepass $$DJANGO_REDIS_PASSWORD --maxmemory 25mb --maxmemory-policy allkeys-lru
      '
    container_name: nest-cache
    env_file: ../../backend/.env
    image: redis:8.10.1-alpine3.23@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    healthcheck:
      interval: 5s
      retries: 5
      test: [CMD, redis-cli, -a, $$DJANGO_REDIS_PASSWORD, ping]
      timeout: 5s
    networks:
      - nest-network
    volumes:
      - cache-data:/data

  db:
    container_name: nest-db
    env_file: ../../backend/.env
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    healthcheck:
      interval: 5s
      retries: 5
      test: [CMD-SHELL, pg_isready -U "$$DJANGO_DB_USER" -d "$$DJANGO_DB_NAME"]
      timeout: 5s
    networks:
      - nest-network
    volumes:
      - db-data:/var/lib/postgresql/data

  docs:
    container_name: nest-docs
    command: python docs/serve.py
    build:
      context: ../../
      dockerfile: docker/docs/Dockerfile.local
    networks:
      - nest-network
    ports:
      - 8001:8001
    volumes:
      - ../../backend:/home/owasp/backend:ro
      - ../../CODE_OF_CONDUCT.md:/home/owasp/CODE_OF_CONDUCT.md:ro
      - ../../CONTRIBUTING.md:/home/owasp/CONTRIBUTING.md:ro
      - ../../docs:/home/owasp/docs
      - ../../frontend:/home/owasp/frontend:ro
      - ../../README.md:/home/owasp/README.md:ro
      - ../../.zensical.toml:/home/owasp/.zensical.toml:ro

  frontend:
    container_name: nest-frontend
    command: >
      sh -c '
        pnpm run dev
      '
    build:
      context: ../../frontend
      dockerfile: ../docker/frontend/Dockerfile.local
    depends_on:
      - backend
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=development
    networks:
      - nest-network
    ports:
      - 3000:3000
    volumes:
      - ../../frontend:/home/owasp
      - frontend-next:/home/owasp/.next
      - frontend-node-modules:/home/owasp/node_modules

  worker:
    container_name: nest-worker
    command: >
      sh -c '
        python manage.py rqworker ai --with-scheduler
      '
    image: nest-local-backend
    depends_on:
      backend:
        condition: service_started
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file: ../../backend/.env
    networks:
      - nest-network
    volumes:
      - ../../backend:/home/owasp
      - backend-venv:/home/owasp/.venv

networks:
  nest-network:

volumes:
  backend-venv:
  cache-data:
  db-data:
  frontend-next:
  frontend-node-modules:
